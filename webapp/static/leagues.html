<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="leagues.title">联赛预测</title>
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/style.css?v=7">
  <style>
    .lg-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .lg-tab { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border, #444);
              background: none; color: inherit; cursor: pointer; }
    .lg-tab.active { background: var(--accent, #4f8cff); color: #fff; border-color: transparent; }
    .lg-sub { display: flex; gap: 6px; margin: 8px 0 16px; flex-wrap: wrap; }
    .lg-sub button { padding: 4px 10px; font-size: 13px; border-radius: 12px;
                     border: 1px solid var(--border, #444); background: none;
                     color: inherit; cursor: pointer; }
    .lg-sub button.active { background: var(--accent, #4f8cff); color: #fff; }
    table.lg { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.lg th, table.lg td { padding: 6px 8px; border-bottom: 1px solid var(--border, #333);
                               text-align: center; }
    table.lg td.teams { text-align: left; }
    .lg-low { color: #e6a23c; font-size: 12px; }
    .lg-mask { color: var(--muted, #999); letter-spacing: 2px; }
    .lg-pro { color: var(--accent, #4f8cff); cursor: pointer; font-size: 12px; }
    .lg-status { color: var(--muted, #999); font-size: 12px; margin-top: 12px; }
    .lg-score { font-weight: 600; }
    .lg-footer { text-align: center; padding: 18px 0 26px; }
    .lg-wc-link { color: var(--muted, #999); font-size: 12px; text-decoration: none; }
    .lg-wc-link:hover { color: var(--accent, #4f8cff); }
    .lg-disclaimer { margin: 8px 0 0; font-size: 11px; color: var(--muted, #999); }
    .lg-pro-label { display: block; font-size: 12px; color: var(--muted, #999); margin: 14px 0 6px; letter-spacing: .05em; }
    .lg-pro-label:first-child { margin-top: 0; }
    .lg-pro-row { display: flex; gap: 8px; }
    .lg-pro-input { flex: 1; background: var(--bg-card, #141419); border: 1px solid var(--line, #2a2a33); color: var(--text, #eee);
      border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
    .lg-pro-input:focus { outline: none; border-color: var(--gold, #c9a961); }
    .lg-pro-btn { width: 100%; margin-top: 8px; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 700; font-size: 13px; font-family: inherit;
      background: linear-gradient(135deg, var(--gold-hi, #e2c684), var(--gold, #c9a961)); color: #0b0b0d; }
    .lg-pro-btn:hover { filter: brightness(1.08); }
    .lg-pro-divider { text-align: center; color: var(--muted, #999); font-size: 12px; margin: 16px 0 2px; }
  </style>
</head>
<body>
<div class="led-strip"></div>

<header class="cmd-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <h1 class="brand-title">LEAGUES <span class="year">PREDICT</span></h1>
      <p class="brand-sub" data-i18n="leagues.subtitle">五大联赛 + 欧冠 · 数据驱动预测 · LIVE PREDICTION DECK</p>
    </div>
  </div>

  <div class="status-cluster" id="statusCluster">
    <div class="status-cell">
      <span class="live-dot" id="liveDot"></span>
      <span class="status-label" id="statusLabel" data-i18n="status.connecting">连接中…</span>
    </div>
    <div class="status-cell">
      <span class="meta-key" data-i18n="common.last_updated">Last updated</span>
      <span class="meta-val mono" id="lastUpdated">-</span>
    </div>
    <div class="status-cell countdown-cell">
      <span class="meta-key" data-i18n="common.next_refresh">Next refresh</span>
      <span class="meta-val mono accent" id="countdown">--</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" data-i18n="nav.refresh" data-i18n-attr="title"
      title="立即触发后台抓取+重算">
      <span class="refresh-ico">⟳</span> <span data-i18n="nav.refresh">立即刷新</span>
    </button>

    <div class="lang-switch" id="langSwitcherWrap">
    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="lang-current" id="langCurrent">🌐 EN</span>
      <span class="lang-arrow">▾</span>
    </button>
    <div class="lang-menu" id="langMenu" role="listbox" hidden></div>
    </div>

    <div class="pro-wrap">
      <button class="pro-btn" id="proBtn" type="button" hidden data-i18n="sub.upgrade">✨ Upgrade</button>
      <span class="pro-badge" id="proBadge" hidden data-i18n="sub.pro_badge">PRO</span>
    </div>
  </div>
</header>
<main>
  <div class="lg-tabs" id="leagueTabs"></div>
  <div class="lg-sub" id="subTabs"></div>
  <section id="content"><p class="lg-status" data-i18n="leagues.not_ready">数据构建中,请稍候…</p></section>
  <p class="lg-status" id="statusLine"></p>
</main>

<aside class="upgrade-modal" id="lgProModal" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="upgrade-head">
    <span class="upgrade-title" data-i18n="sub.upgrade">✨ Upgrade</span>
    <button class="upgrade-close" id="lgProClose" type="button" aria-label="✕">✕</button>
  </div>
  <div class="upgrade-body">
    <label class="lg-pro-label" for="lgEmail" data-i18n="sub.enter_email">输入邮箱</label>
    <div class="lg-pro-row">
      <input class="lg-pro-input" id="lgEmail" type="email" data-i18n="sub.email_placeholder" data-i18n-attr="placeholder" placeholder="your@email.com" autocomplete="email">
    </div>
    <button class="lg-pro-btn" id="lgEmailLoginBtn" type="button" data-i18n="sub.email_login_action">恢复 Pro 访问</button>

    <div class="lg-pro-divider" data-i18n="sub.divider_or">── 或 ──</div>

    <label class="lg-pro-label" for="lgInvite" data-i18n="sub.invite_label">邀请码</label>
    <div class="lg-pro-row">
      <input class="lg-pro-input" id="lgInvite" type="text" data-i18n="sub.invite_placeholder" data-i18n-attr="placeholder" placeholder="邀请码" autocomplete="off">
    </div>
    <button class="lg-pro-btn" id="lgInviteBtn" type="button" data-i18n="sub.invite_action">用邀请码开通</button>

    <div class="upgrade-status" id="lgProStatus" hidden></div>
  </div>
</aside>
<div class="upgrade-scrim" id="lgProScrim" hidden></div>

<footer class="lg-footer">
  <a href="/wc" class="lg-wc-link" data-i18n="footer.wc_archive" title="World Cup 2026">⚽ 世界杯 2026（已落幕）»</a>
  <p class="lg-disclaimer" data-i18n="footer.disclaimer">预测数据仅供参考，不构成任何投注建议</p>
</footer>
<script src="static/i18n.js?v=27"></script>
<script src="static/leagues.js?v=8"></script>
</body>
</html>
