<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="leagues.title">联赛预测</title>
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/style.css?v=7">
  <style>
    .lg-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .lg-tab { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border, #444);
              background: none; color: inherit; cursor: pointer; }
    .lg-tab.active { background: var(--accent, #4f8cff); color: #fff; border-color: transparent; }
    .lg-sub { display: flex; gap: 6px; margin: 8px 0 16px; flex-wrap: wrap; }
    .lg-sub button { padding: 4px 10px; font-size: 13px; border-radius: 12px;
                     border: 1px solid var(--border, #444); background: none;
                     color: inherit; cursor: pointer; }
    .lg-sub button.active { background: var(--accent, #4f8cff); color: #fff; }
    .lg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .lg-fold-arrow { display: inline-block; font-size: 20px; line-height: 1; color: var(--accent, #4f8cff);
                     transition: transform .2s; margin-left: auto; padding: 2px 6px; }
    details[open] > summary .lg-fold-arrow { transform: rotate(180deg); }
    details.lg-post > summary { display: flex; align-items: center; cursor: pointer; list-style: none;
                                font-size: 16px; padding: 10px 8px; user-select: none; }
    details.lg-post > summary::-webkit-details-marker { display: none; }
    .lg-scroll table.lg { min-width: 480px; }
    /* 大字号模式:隐藏次要列(赔率/比分预测),核心列整屏放下,无需横拖 */
    html.fb-large .lg-c-odds, html.fb-large .lg-c-top { display: none; }
    html.fb-large .lg-scroll table.lg { min-width: 0; }
    table.lg { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.lg th, table.lg td { padding: 6px 8px; border-bottom: 1px solid var(--border, #333);
                               text-align: center; }
    table.lg td.teams { text-align: left; }
    .lg-low { color: #e6a23c; font-size: 12px; }
    .lg-mask { color: var(--muted, #999); letter-spacing: 2px; }
    .lg-pro { color: var(--accent, #4f8cff); cursor: pointer; font-size: 12px; }
    .lg-status { color: var(--muted, #999); font-size: 12px; margin-top: 12px; }
    .lg-score { font-weight: 600; }
    .lg-footer { text-align: center; padding: 18px 0 26px; }
    .lg-wc-link { color: var(--muted, #999); font-size: 12px; text-decoration: none; }
    .lg-wc-link:hover { color: var(--accent, #4f8cff); }
    .lg-disclaimer { margin: 8px 0 0; font-size: 11px; color: var(--muted, #999); }
    .lg-pro-label { display: block; font-size: 12px; color: var(--muted, #999); margin: 14px 0 6px; letter-spacing: .05em; }
    .lg-pro-label:first-child { margin-top: 0; }
    .lg-pro-row { display: flex; gap: 8px; }
    .lg-pro-input { flex: 1; background: var(--bg-card, #141419); border: 1px solid var(--line, #2a2a33); color: var(--text, #eee);
      border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
    .lg-pro-input:focus { outline: none; border-color: var(--gold, #c9a961); }
    .lg-pro-btn { width: 100%; margin-top: 8px; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 700; font-size: 13px; font-family: inherit;
      background: linear-gradient(135deg, var(--gold-hi, #e2c684), var(--gold, #c9a961)); color: #0b0b0d; }
    .lg-pro-btn:hover { filter: brightness(1.08); }
    .lg-pro-divider { text-align: center; color: var(--muted, #999); font-size: 12px; margin: 16px 0 2px; }
    /* ── 今日/即将开赛聚合板 ── */
    .lg-today { margin: 14px 0 4px; border: 1px solid var(--line, #2a2a33); border-radius: 12px;
      background: var(--bg-card, #141419); padding: 12px 14px 10px; }
    .lg-today-title { font-size: 14px; letter-spacing: .06em; margin: 0; display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; user-select: none; }
    .lg-today-title::-webkit-details-marker { display: none; }
    .lg-today-title .lg-today-arrow { margin-left: auto; font-size: 20px; color: var(--accent, #4f8cff); transition: transform .2s; padding: 2px 4px; }
    details.lg-today[open] .lg-today-arrow { transform: rotate(180deg); }
    .lg-today-date { font-size: 12px; color: var(--muted, #999); margin: 10px 0 4px; display: flex; align-items: center; gap: 6px; }
    .lg-today-count { background: var(--line, #2a2a33); border-radius: 8px; padding: 0 7px; font-size: 11px; }
    .lg-today-row { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 8px;
      font-size: 13px; cursor: pointer; flex-wrap: wrap; }
    .lg-today-row:hover { background: rgba(79, 140, 255, .08); }
    .lg-today-time { min-width: 44px; color: var(--muted, #999); }
    .lg-chip { border: 1px solid var(--border, #444); background: transparent; color: var(--accent, #4f8cff);
      border-radius: 10px; padding: 1px 8px; font-size: 11px; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .lg-today-row .teams { flex: 1; min-width: 180px; }
    .lg-today-probs { font-size: 12px; color: var(--muted, #999); display: inline-flex; gap: 6px; }
    .lg-today-probs .lg-fav { color: var(--accent, #4f8cff); font-weight: 700; }
    .lg-today-odds { font-size: 12px; color: var(--muted, #999); }
    /* ── 手机适配:大字号 + 满屏利用 ── */
    @media (max-width: 640px) {
      .lg-today { padding: 8px 8px 6px; margin: 8px 0 2px; border-radius: 10px; }
      .lg-today-title { font-size: 17px; }
      .lg-today-date { font-size: 15px; margin: 6px 0 1px; }
      .lg-today-count { font-size: 12px; }
      .lg-today-row { display: grid; grid-template-columns: auto auto 1fr; align-items: center;
                      column-gap: 8px; row-gap: 1px; padding: 6px 3px; font-size: 17px;
                      border-bottom: 1px solid var(--border, #2a2a33); border-radius: 0; }
      .lg-today-row:last-child { border-bottom: none; }
      .lg-today-row:hover { background: none; }
      .lg-today-row:active { background: rgba(79, 140, 255, .12); }
      .lg-today-time { min-width: 0; color: var(--text, #eee); font-size: 17px; font-weight: 700; }
      .lg-chip { font-size: 13px; padding: 2px 9px; }
      .lg-today-row .teams { min-width: 0; font-size: 17px; font-weight: 500; }
      .lg-today-probs { font-size: 16px; gap: 14px; grid-column: 1 / -1; padding-left: 2px; }
      .lg-today-odds { font-size: 14px; grid-column: 1 / -1; text-align: right; }
      .lg-tabs { gap: 6px; margin: 8px 0 5px; }
      .lg-tab { padding: 10px 18px; font-size: 16px; }
      .lg-sub { gap: 6px; margin: 5px 0 8px; }
      .lg-sub button { padding: 8px 14px; font-size: 15px; }
      table.lg { font-size: 16px; }
      table.lg th, table.lg td { padding: 9px 5px; }
      main { padding-left: 8px; padding-right: 8px; }
    }
    /* ── 手机横屏:压扁头部,单行看板,充分利用宽度 ── */
    @media (orientation: landscape) and (max-height: 520px) {
      .cmd-header { padding: 6px 14px; flex-wrap: nowrap; }
      .cmd-header .brand-sub { display: none; }
      .cmd-header .brand-title { font-size: 16px; }
      .cmd-header .countdown-cell { display: none; }
      .lg-today { margin: 6px 0 2px; }
      .lg-today-title { font-size: 15px; }
      .lg-today-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 12px; padding: 4px 4px; font-size: 15px; }
      .lg-today-row .teams { flex: 1; min-width: 120px; }
      .lg-today-probs { font-size: 14px; }
      .lg-today-odds { font-size: 13px; }
      .lg-tabs { margin: 6px 0 4px; }
      .lg-tab { padding: 6px 14px; font-size: 14px; }
      .lg-sub { margin: 4px 0 6px; }
      .lg-sub button { padding: 5px 11px; font-size: 13px; }
      table.lg { font-size: 14px; }
      table.lg th, table.lg td { padding: 6px 5px; }
    }
  </style>
</head>
<body>
<div class="led-strip"></div>

<header class="cmd-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <h1 class="brand-title">LEAGUES <span class="year">PREDICT</span></h1>
      <p class="brand-sub" data-i18n="leagues.subtitle">五大联赛 + 欧冠 · 数据驱动预测 · LIVE PREDICTION DECK</p>
    </div>
  </div>

  <div class="status-cluster" id="statusCluster">
    <div class="status-cell">
      <span class="live-dot" id="liveDot"></span>
      <span class="status-label" id="statusLabel" data-i18n="status.connecting">连接中…</span>
    </div>
    <div class="status-cell">
      <span class="meta-key" data-i18n="common.last_updated">Last updated</span>
      <span class="meta-val mono" id="lastUpdated">-</span>
    </div>
    <div class="status-cell countdown-cell">
      <span class="meta-key" data-i18n="common.next_refresh">Next refresh</span>
      <span class="meta-val mono accent" id="countdown">--</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" data-i18n="nav.refresh" data-i18n-attr="title"
      title="立即触发后台抓取+重算">
      <span class="refresh-ico">⟳</span> <span data-i18n="nav.refresh">立即刷新</span>
    </button>
    <button class="refresh-btn" id="fontFitBtn" title="恢复默认字号" style="padding:0 10px"
      onclick="if(window.fbResetFontScale)fbResetFontScale()">Aa</button>

    <div class="lang-switch" id="langSwitcherWrap">
    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="lang-current" id="langCurrent">🌐 EN</span>
      <span class="lang-arrow">▾</span>
    </button>
    <div class="lang-menu" id="langMenu" role="listbox" hidden></div>
    </div>

    <div class="pro-wrap">
      <button class="pro-btn" id="proBtn" type="button" hidden data-i18n="sub.upgrade">✨ Upgrade</button>
      <span class="pro-badge" id="proBadge" hidden data-i18n="sub.pro_badge">PRO</span>
    </div>
  </div>
</header>
<main>
  <div class="lg-tabs" id="leagueTabs"></div>
  <div class="lg-sub" id="subTabs"></div>
  <details class="lg-today" id="todayBoard" hidden>
    <summary class="lg-today-title"><span class="live-dot on"></span><span data-i18n="leagues.today_title">今日 &amp; 即将开赛</span><span class="lg-today-count" id="todayCount"></span><span class="lg-today-arrow">▾</span></summary>
    <div id="todayGroups"></div>
  </details>
  <section id="content"><p class="lg-status" data-i18n="leagues.not_ready">数据构建中,请稍候…</p></section>
  <p class="lg-status" id="statusLine"></p>
</main>

<aside class="upgrade-modal" id="lgProModal" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="upgrade-head">
    <span class="upgrade-title" data-i18n="sub.upgrade">✨ Upgrade</span>
    <button class="upgrade-close" id="lgProClose" type="button" aria-label="✕">✕</button>
  </div>
  <div class="upgrade-body">
    <label class="lg-pro-label" for="lgEmail" data-i18n="sub.enter_email">输入邮箱</label>
    <div class="lg-pro-row">
      <input class="lg-pro-input" id="lgEmail" type="email" data-i18n="sub.email_placeholder" data-i18n-attr="placeholder" placeholder="your@email.com" autocomplete="email">
    </div>
    <button class="lg-pro-btn" id="lgEmailLoginBtn" type="button" data-i18n="sub.email_login_action">恢复 Pro 访问</button>

    <div class="lg-pro-divider" data-i18n="sub.divider_or">── 或 ──</div>

    <label class="lg-pro-label" for="lgInvite" data-i18n="sub.invite_label">邀请码</label>
    <div class="lg-pro-row">
      <input class="lg-pro-input" id="lgInvite" type="text" data-i18n="sub.invite_placeholder" data-i18n-attr="placeholder" placeholder="邀请码" autocomplete="off">
    </div>
    <button class="lg-pro-btn" id="lgInviteBtn" type="button" data-i18n="sub.invite_action">用邀请码开通</button>

    <div class="upgrade-status" id="lgProStatus" hidden></div>
  </div>
</aside>
<div class="upgrade-scrim" id="lgProScrim" hidden></div>

<footer class="lg-footer">
  <a href="/wc" class="lg-wc-link" data-i18n="footer.wc_archive" title="World Cup 2026">⚽ 世界杯 2026（已落幕）»</a>
  <p class="lg-disclaimer" data-i18n="footer.disclaimer">预测数据仅供参考，不构成任何投注建议</p>
</footer>
<script>
// 兼容诊断:任何 JS 报错直接显示在页面底部,方便老设备定位问题
window.addEventListener('error', function (e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#c0392b;color:#fff;font:12px/1.5 monospace;padding:6px 10px;white-space:pre-wrap;';
  d.textContent = 'JS错误: ' + (e.message || 'unknown') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '');
  document.body.appendChild(d);
});
window.addEventListener('unhandledrejection', function (e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#c0392b;color:#fff;font:12px/1.5 monospace;padding:6px 10px;white-space:pre-wrap;';
  d.textContent = 'Promise错误: ' + ((e.reason && e.reason.message) || e.reason || 'unknown');
  document.body.appendChild(d);
});
</script>
<script src="static/i18n.js?v=30"></script>
<script src="static/fontfit.js?v=2"></script>
<script src="static/leagues.js?v=22"></script>
</body>
</html>
